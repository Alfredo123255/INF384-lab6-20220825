name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secretos:
    name: Gate de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # trae todo el historial para escanear commits antiguos

      - name: Instalar gitleaks
        run: curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz -C /tmp gitleaks

      - name: Escanear todo el historial
        run: /tmp/gitleaks git . --redact -v

  sca:
    name: Gate de SCA (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (falla con severidad alta o crítica)
        run: npm audit --audit-level=high --omit=dev

  build:
    name: Build y tests (cobertura >= 80 %)
    runs-on: ubuntu-latest
    needs: [secretos, sca]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
